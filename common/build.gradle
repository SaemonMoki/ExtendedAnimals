plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = project.neo_form_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    sourceSets.main.java.sourceDirectories.each { dir -> commonJava(dir) }
    sourceSets.main.resources.sourceDirectories.each { dir -> commonResources(dir) }
}

tasks.named('compileJava', JavaCompile).configure {
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}
