  name: Branch and PR for in-progress subtasks
  on:
    schedule:
      - cron: '*/5 * * * *'
    workflow_dispatch:

  concurrency:
    group: in-progress-branches
    cancel-in-progress: false

  jobs:
    branch-and-pr:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/github-script@v7
          with:
            github-token: ${{ secrets.PROJECT_TOKEN }}
            script: |
              const { owner, repo } = context.repo;
              const headers = { 'GraphQL-Features': 'sub_issues' };
              const query = `query($owner: String!, $repo: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  id
                  defaultBranchRef { name target { oid } }
                  issues(states: OPEN, first: 100, after: $cursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id number title
                      parent { number }
                      assignees(first: 10) { nodes { login } }
                      linkedBranches(first: 1) { totalCount }
                      projectItems(first: 10) {
                        nodes {
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                        }
                      }
                    }
                  }
                }
              }`;
  
              // Find open subtasks that are In Progress and have no branch yet
              let cursor = null, repoInfo, todo = [];
              do {
                const res = await github.graphql(query, { owner, repo, cursor, headers });
                repoInfo = res.repository;
                for (const issue of repoInfo.issues.nodes) {
                  if (!issue.parent) continue;
                  if (issue.linkedBranches.totalCount > 0) continue;
                  const inProgress = issue.projectItems.nodes.some(
                    i => i.fieldValueByName?.name?.toLowerCase() === 'in progress');
                  if (inProgress) todo.push(issue);
                }
                const page = repoInfo.issues.pageInfo;
                cursor = page.hasNextPage ? page.endCursor : null;
              } while (cursor);

              if (!todo.length) { core.info('Nothing to do.'); return; }

              const base = repoInfo.defaultBranchRef.name;
              const baseSha = repoInfo.defaultBranchRef.target.oid;
              const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });

              for (const issue of todo) {
                // "Create for 1.18: Copper golem block" -> "1.18: Copper golem block"
                const name = issue.title.replace(/^create for\s*/i, '').trim();
                // Branch names can't contain spaces or ":" -> "1.18-copper-golem-block"
                const branch = name.toLowerCase()
                  .replace(/[^a-z0-9.]+/g, '-')
                  .replace(/\.{2,}/g, '.')
                  .replace(/^[-.]+|[-.]+$/g, '');
                try {
                  // Create the branch and link it to the subtask (shows under "Development")
                  await github.graphql(`mutation($input: CreateLinkedBranchInput!) {
                    createLinkedBranch(input: $input) { linkedBranch { id } }
                  }`, { input: { issueId: issue.id, repositoryId: repoInfo.id, oid: baseSha, name: branch } });

                  // A PR needs at least one commit, so add an empty starter commit
                  const { data: commit } = await github.rest.git.createCommit({
                    owner, repo, message: `Start ${name}`,
                    tree: baseCommit.tree.sha, parents: [baseSha] });
                  await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.sha });

                  // Open the PR, linked to the subtask so merging it closes the subtask
                  const { data: pr } = await github.rest.pulls.create({
                    owner, repo, head: branch, base, title: name,
                    body: `Closes #${issue.number}` });
                  const assignees = issue.assignees.nodes.map(a => a.login);
                  const assignees = issue.assignees.nodes.map(a => a.login);
                  if (assignees.length) {
                    await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees });
                  }
                  core.info(`#${issue.number}: branch ${branch}, PR #${pr.number}`);
                } catch (err) {
                  core.warning(`#${issue.number} (${issue.title}): ${err.message}`);
                }
              }
